org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 本机已装 JDK 21（FlyEnv 内）：固定 daemon JVM，避免 Gradle 走 foojay 自动下载工具链
org.gradle.java.home=C\:\\FlyEnv\\FlyEnv-Data\\app\\openjdk-21.0.12.1
# core-geo 用 jvmToolchain(17)；本机 JDK 17 在 FlyEnv 内，显式登记避免 Gradle 找不到工具链
org.gradle.java.installations.paths=C\:\\FlyEnv\\FlyEnv-Data\\app\\openjdk-17.0.20.1
android.useAndroidX=true
# 工程目录含中文（0_archive/乐跑），AGP 默认拒绝构建；仅关闭路径检查，不影响产物
android.overridePathCheck=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false

# 单一版本号来源：:app 和 :app-ui 都从这里读取，避免多模块拆分后版本号各写一份、逐渐漂移
APP_VERSION_CODE=30000
APP_VERSION_NAME=3.0.0
